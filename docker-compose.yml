services:
  db:
    image: postgres:16-alpine
    container_name: approveflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-approveflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-approveflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-approveflow_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-approveflow_user} -d ${POSTGRES_DB:-approveflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: approveflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: approveflow_api
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${HOST_PORT:-8001}:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-approveflow-docker-dev-key}
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://${POSTGRES_USER:-approveflow_user}:${POSTGRES_PASSWORD:-approveflow_password}@db:5432/${POSTGRES_DB:-approveflow_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery_worker:
    build: .
    container_name: approveflow_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-approveflow-docker-dev-key}
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://${POSTGRES_USER:-approveflow_user}:${POSTGRES_PASSWORD:-approveflow_password}@db:5432/${POSTGRES_DB:-approveflow_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: approveflow_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-approveflow-docker-dev-key}
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://${POSTGRES_USER:-approveflow_user}:${POSTGRES_PASSWORD:-approveflow_password}@db:5432/${POSTGRES_DB:-approveflow_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

